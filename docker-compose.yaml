services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql-container
      - redis-container
    ports:
      - 3000:3000
    networks:
      - common-network
  mysql-container:
    image: mysql
    ports:
      - 3306:3306 
    environment:
      MYSQL_DATABASE: recipe
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - /Users/hs/mysql:/var/lib/mysql
    networks:
      - common-network
  redis-container:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - /Users/hs/redis⁠:/data
    networks:
      - common-network
  minio-container:
    image: minio/minio
    container_name: minio-container
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - /Users/hs/minio/data:/data
    networks:
      - common-network
networks:
  common-network:
    driver: bridge
    name: common-network